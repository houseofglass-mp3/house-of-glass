<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>house of glass</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500&display=swap');

body {
  margin: 0;
  background: black;
  color: white;
  font-family: 'Montserrat', sans-serif;
  overflow: hidden;
}

video {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -1;
}

/* Landing */
#landing {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

#landing h1 {
  font-size: 3rem;
  letter-spacing: 8px;
  font-weight: 500;
}

.enter-btn {
  margin-top: 25px;
  padding: 8px 20px;
  border: 1px solid white;
  background: transparent;
  color: white;
  letter-spacing: 3px;
  cursor: pointer;
  transition: 0.3s;
}

.enter-btn:hover {
  background: white;
  color: black;
}

/* Password */
#passwordPage {
  display: none;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

#passwordInput {
  padding: 10px 20px;
  font-size: 1rem;
  letter-spacing: 3px;
  background: transparent;
  border: 1px solid white;
  color: white;
  width: 240px;
  text-align: center;
}

.submit-btn {
  margin-top: 15px;
  padding: 6px 18px;
  border: 1px solid white;
  background: transparent;
  color: white;
  letter-spacing: 2px;
  cursor: pointer;
  transition: 0.3s;
}

.submit-btn:hover {
  background: white;
  color: black;
}

/* Music Page */
#musicPage {
  display: none;
  position: absolute;
  bottom: 60px;
  width: 100%;
  text-align: center;
}

#trackTitle {
  font-size: 0.8rem;
  letter-spacing: 4px;
  margin-bottom: 15px;
  opacity: 0.8;
}

/* Custom Player */
.player {
  width: 300px;
  margin: 0 auto;
}

#progress {
  width: 100%;
  height: 2px;
  background: white;
  cursor: pointer;
  position: relative;
}

#progressFilled {
  height: 2px;
  width: 0%;
  background: black;
}

.play-btn {
  margin-top: 15px;
  padding: 6px 16px;
  border: 1px solid white;
  background: white;
  color: black;
  cursor: pointer;
  letter-spacing: 2px;
}
</style>
</head>

<body>

<video autoplay loop muted playsinline>
  <source src="landing.mp4" type="video/mp4">
</video>

<div id="landing">
  <h1>HOUSE OF GLASS</h1>
  <button class="enter-btn" onclick="goToPassword()">ENTER NOW</button>
</div>

<div id="passwordPage">
  <input type="password" id="passwordInput" placeholder="password">
  <br>
  <button class="submit-btn" onclick="checkPassword()">ENTER</button>
</div>

<div id="musicPage">
  <div id="trackTitle">good luck madeleine</div>
  <div class="player">
    <div id="progress" onclick="seek(event)">
      <div id="progressFilled"></div>
    </div>
    <button class="play-btn" onclick="togglePlay()">PLAY</button>
  </div>
</div>

<audio id="audio">
  <source src="good_luck_madeleine.mp3" type="audio/mpeg">
</audio>

<script>
function goToPassword() {
  document.getElementById("landing").style.display = "none";
  document.getElementById("passwordPage").style.display = "block";
}

function checkPassword() {
  var password = document.getElementById("passwordInput").value;
  if(password === "houseofglass") {
    document.getElementById("passwordPage").style.display = "none";
    document.getElementById("musicPage").style.display = "block";
  } else {
    alert("wrong password");
  }
}

var audio = document.getElementById("audio");
var playBtn = document.querySelector(".play-btn");
var progressFilled = document.getElementById("progressFilled");

function togglePlay() {
  if(audio.paused) {
    audio.play();
    playBtn.textContent = "PAUSE";
  } else {
    audio.pause();
    playBtn.textContent = "PLAY";
  }
}

audio.addEventListener("timeupdate", function() {
  var percent = (audio.currentTime / audio.duration) * 100;
  progressFilled.style.width = percent + "%";
});

function seek(e) {
  var width = e.currentTarget.clientWidth;
  var clickX = e.offsetX;
  var duration = audio.duration;
  audio.currentTime = (clickX / width) * duration;
}
</script>

</body>
</html>
