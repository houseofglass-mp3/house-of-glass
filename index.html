<!DOCTYPE html>
<html>
<head>
  <title>good luck madeleine</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: 'Press Start 2P', monospace;
      background: white;
      color: black;
      overflow: hidden;
    }

    /* Landing page with video */
    #landing {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    #landing video {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    #passwordContainer {
      background: white;
      border: 3px solid black;
      padding: 30px;
      text-align: center;
    }

    #passwordInput {
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      padding: 10px;
      width: 200px;
      margin-top: 10px;
      border: 2px solid black;
      background: white;
      color: black;
    }

    #submitBtn {
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      padding: 10px 20px;
      margin-top: 15px;
      border: 2px solid black;
      background: white;
      cursor: pointer;
    }

    #submitBtn:hover {
      background: black;
      color: white;
    }

    /* Main content after password */
    #mainContent {
      display: none;
      width: 100%;
      height: 100%;
      text-align: center;
      padding-top: 50px;
      background: white;
    }

    audio {
      margin-top: 40px;
      width: 80%;
      max-width: 500px;
    }
  </style>
</head>
<body>

<!-- Landing with video + password form -->
<div id="landing">
  <video autoplay loop muted>
    <source src="landing.mp4" type="video/mp4">
  </video>
  <div id="passwordContainer">
    <p>enter password</p>
    <input type="password" id="passwordInput" placeholder="password">
    <br>
    <button id="submitBtn">submit</button>
  </div>
</div>

<!-- Main content with track -->
<div id="mainContent">
  <h1>good luck madeleine</h1>
  <audio controls>
    <source src="https://drive.google.com/uc?export=download&id=1jUqO9_arO8nOiIeVMFgnMnFGqHwnDR7O" type="audio/mpeg">
  </audio>
</div>

<script>
  const submitBtn = document.getElementById('submitBtn');
  const passwordInput = document.getElementById('passwordInput');

  submitBtn.addEventListener('click', () => {
    const pwd = passwordInput.value.trim().toLowerCase();
    if(pwd === 'madeleine') {
      document.getElementById('landing').style.display = 'none';
      document.getElementById('mainContent').style.display = 'block';
    } else {
      alert('access denied');
      passwordInput.value = '';
    }
  });

  // Optional: submit with Enter key
  passwordInput.addEventListener('keypress', (e) => {
    if(e.key === 'Enter'){
      submitBtn.click();
    }
  });
</script>

</body>
</html>
