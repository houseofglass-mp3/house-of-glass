<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>house of glass</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* GLOBAL */
body {
  margin: 0;
  font-family: 'Press Start 2P', monospace;
}

/* VIDEO BACKGROUND */
video {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -1;
}

/* LANDING */
#landing {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  color: white;
}

#landing h1 {
  font-size: 4rem;
  letter-spacing: 6px;
  margin-bottom: 30px;
}

.enter-btn {
  padding: 10px 24px;
  border: 1px solid white;
  background: transparent;
  color: white;
  font-size: 0.9rem;
  letter-spacing: 2px;
  cursor: pointer;
}

.enter-btn:hover {
  background: white;
  color: black;
}

/* PASSWORD PAGE */
#passwordPage {
  display: none;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

#passwordInput {
  padding: 14px 24px;
  font-size: 1.1rem;
  letter-spacing: 2px;
  background: transparent;
  border: 2px solid black;
  color: black;
  width: 300px;
  text-align: center;
}

.submit-btn {
  margin-top: 20px;
  padding: 10px 24px;
  font-size: 0.9rem;
  border: 2px solid black;
  background: black;
  color: white;
  cursor: pointer;
}

.submit-btn:hover {
  background: white;
  color: black;
}

/* MUSIC PAGE */
#musicPage {
  display: none;
  background: white;
  width: 100%;
  height: 100vh;
  text-align: center;
  position: relative;
}

#trackTitle {
  font-size: 1rem;
  margin-top: 30vh;
  margin-bottom: 15px;
  color: black;
}

.player {
  width: 220px;
  margin: 0 auto;
}

#progress {
  width: 100%;
  height: 3px;
  background: black;
  cursor: pointer;
  position: relative;
}

#progressFilled {
  height: 3px;
  width: 0%;
  background: gray;
}

.play-btn {
  margin-top: 10px;
  padding: 6px 16px;
  border: 1px solid black;
  background: black;
  color: white;
  font-size: 0.8rem;
  cursor: pointer;
}
</style>
</head>
<body>

<!-- LANDING PAGE -->
<video autoplay loop muted playsinline>
  <source src="landing.mp4" type="video/mp4">
</video>

<div id="landing">
  <h1>HOUSE OF GLASS</h1>
  <button class="enter-btn" onclick="goToPassword()">ENTER NOW</button>
</div>

<!-- PASSWORD PAGE -->
<div id="passwordPage">
  <input type="password" id="passwordInput" placeholder="PASSWORD">
  <br>
  <button class="submit-btn" onclick="checkPassword()">ENTER</button>
</div>

<!-- MUSIC PAGE -->
<div id="musicPage">
  <div id="trackTitle">good luck madeleine</div>
  <div class="player">
    <div id="progress" onclick="seek(event)">
      <div id="progressFilled"></div>
    </div>
    <button class="play-btn" onclick="togglePlay()">PLAY</button>
  </div>
</div>

<audio id="audio" preload="auto">
  <source src="GoodLuckMadeleine.mp3" type="audio/mpeg">
</audio>

<script>
function goToPassword() {
  document.getElementById("landing").style.display = "none";
  document.getElementById("passwordPage").style.display = "block";
}

function checkPassword() {
  var password = document.getElementById("passwordInput").value.trim().toLowerCase();
  if(password === "madeleine") {
    document.getElementById("passwordPage").style.display = "none";
    document.getElementById("musicPage").style.display = "block";
  } else {
    alert("wrong password");
  }
}

/* AUDIO PLAYER */
var audio = document.getElementById("audio");
var playBtn = document.querySelector(".play-btn");
var progressFilled = document.getElementById("progressFilled");

function togglePlay() {
  if(audio.paused) {
    audio.play();
    playBtn.textContent = "PAUSE";
  } else {
    audio.pause();
    playBtn.textContent = "PLAY";
  }
}

audio.addEventListener("timeupdate", function() {
  if(audio.duration) {
    var percent = (audio.currentTime / audio.duration) * 100;
    progressFilled.style.width = percent + "%";
  }
});

function seek(e) {
  var width = e.currentTarget.clientWidth;
  var clickX = e.offsetX;
  audio.currentTime = (clickX / width) * audio.duration;
}
</script>

</body>
</html>
