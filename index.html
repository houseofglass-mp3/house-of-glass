<!DOCTYPE html>
<html>
<head>
  <title>Good Luck Madeleine</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Press Start 2P', monospace; /* pixel font */
      background: white;
      color: black;
      text-align: center;
    }

    #landing {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    #landing video {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    #enterBtn {
      font-size: 20px;
      padding: 20px 50px;
      cursor: pointer;
      border: 3px solid black;
      background: white;
      color: black;
    }

    #mainContent {
      display: none;
      padding-top: 50px;
    }

    audio {
      margin-top: 40px;
      width: 80%;
      max-width: 500px;
    }

    /* Optional retro hover effect */
    #enterBtn:hover {
      background: black;
      color: white;
    }
  </style>
</head>
<body>

<div id="landing">
  <video autoplay loop muted>
    <source src="YOUR_VIDEO.mp4" type="video/mp4">
  </video>
  <button id="enterBtn">ENTER NOW</button>
</div>

<div id="mainContent">
  <h1>Good Luck Madeleine</h1>
  <audio controls>
    <source src="https://drive.google.com/uc?export=download&id=1jUqO9_arO8nOiIeVMFgnMnFGqHwnDR7O" type="audio/mpeg">
  </audio>
</div>

<script>
  document.getElementById("enterBtn").onclick = function() {
    var pwd = prompt("Enter access code:");
    if (pwd === "madeleine") {
      document.getElementById("landing").style.display = "none";
      document.getElementById("mainContent").style.display = "block";
    } else {
      alert("Access denied.");
    }
  };
</script>

</body>
</html>
