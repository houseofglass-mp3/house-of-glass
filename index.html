<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>house of glass</title>

<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

video {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -1;
}

/* Landing Page */
#landing {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

#landing h1 {
  font-size: 3rem;
  letter-spacing: 6px;
  margin-bottom: 25px;
}

.enter-btn {
  background: transparent;
  border: 1px solid white;
  color: white;
  padding: 8px 20px;
  font-size: 0.8rem;
  letter-spacing: 3px;
  cursor: pointer;
  transition: 0.3s ease;
}

.enter-btn:hover {
  background: white;
  color: black;
}

/* Password Page */
#passwordPage {
  display: none;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

input {
  background: transparent;
  border: 1px solid white;
  color: white;
  padding: 8px;
  text-align: center;
  letter-spacing: 2px;
  outline: none;
}

.submit-btn {
  margin-top: 15px;
  background: transparent;
  border: 1px solid white;
  color: white;
  padding: 6px 16px;
  font-size: 0.7rem;
  letter-spacing: 2px;
  cursor: pointer;
  transition: 0.3s ease;
}

.submit-btn:hover {
  background: white;
  color: black;
}

/* Music Page */
#musicPage {
  display: none;
  position: absolute;
  bottom: 50px;
  width: 100%;
  text-align: center;
}

#trackTitle {
  font-size: 0.7rem;
  letter-spacing: 3px;
  margin-bottom: 10px;
  opacity: 0.7;
}

.player-wrapper {
  width: 300px;
  margin: 0 auto;
}
</style>
</head>

<body>

<!-- Background Video -->
<video autoplay loop muted playsinline>
  <source src="landing.mp4" type="video/mp4">
</video>

<!-- Landing Page -->
<div id="landing">
  <h1>HOUSE OF GLASS</h1>
  <button class="enter-btn" onclick="goToPassword()">ENTER NOW</button>
</div>

<!-- Password Page -->
<div id="passwordPage">
  <input type="password" id="passwordInput" placeholder="password">
  <br>
  <button class="submit-btn" onclick="checkPassword()">ENTER</button>
</div>

<!-- Music Page -->
<div id="musicPage">
  <div id="trackTitle">good luck madeleine</div>
  <div class="player-wrapper">
    <iframe 
      width="100%" 
      height="20" 
      scrolling="no" 
      frameborder="no" 
      allow="autoplay"
      src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/2273392907%3Fsecret_token%3Ds-qJ1Ok6KvEYJ&color=%23292424&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false&visual=false">
    </iframe>
  </div>
</div>

<script>
function goToPassword() {
  document.getElementById("landing").style.display = "none";
  document.getElementById("passwordPage").style.display = "block";
}

function checkPassword() {
  var password = document.getElementById("passwordInput").value;
  if(password === "houseofglass") {   // CHANGE PASSWORD HERE
    document.getElementById("passwordPage").style.display = "none";
    document.getElementById("musicPage").style.display = "block";
  } else {
    alert("wrong password");
  }
}
</script>

</body>
</html>
