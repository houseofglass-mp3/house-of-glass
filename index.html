<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>house of glass</title>

<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
  overflow: hidden;
}

video {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -1;
}

/* LANDING */
#landing {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

#landing h1 {
  font-size: 4rem;
  letter-spacing: 8px;
  margin-bottom: 30px;
}

.enter-btn {
  padding: 12px 28px;
  border: 1px solid white;
  background: transparent;
  color: white;
  font-size: 1rem;
  letter-spacing: 3px;
  cursor: pointer;
}

.enter-btn:hover {
  background: white;
  color: black;
}

/* PASSWORD */
#passwordPage {
  display: none;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

#passwordInput {
  padding: 16px 26px;
  font-size: 1.3rem;
  letter-spacing: 4px;
  background: transparent;
  border: 1px solid white;
  color: white;
  width: 320px;
  text-align: center;
}

.submit-btn {
  margin-top: 22px;
  padding: 12px 28px;
  font-size: 1rem;
  border: 1px solid white;
  background: transparent;
  color: white;
  letter-spacing: 3px;
  cursor: pointer;
}

.submit-btn:hover {
  background: white;
  color: black;
}

/* MUSIC */
#musicPage {
  display: none;
  position: absolute;
  bottom: 80px;
  width: 100%;
  text-align: center;
}

#trackTitle {
  font-size: 1rem;
  letter-spacing: 4px;
  margin-bottom: 25px;
}

.player {
  width: 420px;
  margin: 0 auto;
}

#progress {
  width: 100%;
  height: 3px;
  background: white;
  cursor: pointer;
  position: relative;
}

#progressFilled {
  height: 3px;
  width: 0%;
  background: black;
}

.play-btn {
  margin-top: 25px;
  padding: 12px 28px;
  border: 1px solid white;
  background: white;
  color: black;
  font-size: 1rem;
  letter-spacing: 3px;
  cursor: pointer;
}
</style>
</head>

<body>

<video autoplay loop muted playsinline>
  <source src="landing.mp4" type="video/mp4">
</video>

<div id="landing">
  <h1>HOUSE OF GLASS</h1>
  <button class="enter-btn" onclick="goToPassword()">ENTER NOW</button>
</div>

<div id="passwordPage">
  <input type="password" id="passwordInput" placeholder="PASSWORD">
  <br>
  <button class="submit-btn" onclick="checkPassword()">ENTER</button>
</div>

<div id="musicPage">
  <div id="trackTitle">good luck madeleine</div>
  <div class="player">
    <div id="progress" onclick="seek(event)">
      <div id="progressFilled"></div>
    </div>
    <button class="play-btn" onclick="togglePlay()">PLAY</button>
  </div>
</div>

<audio id="audio" preload="auto">
  <source src="GoodLuckMadeleine.mp3" type="audio/mpeg">
</audio>

<script>
function goToPassword() {
  document.getElementById("landing").style.display = "none";
  document.getElementById("passwordPage").style.display = "block";
}

function checkPassword() {
  var password = document.getElementById("passwordInput").value.trim().toLowerCase();
  if (password === "madeleine") {
    document.getElementById("passwordPage").style.display = "none";
    document.getElementById("musicPage").style.display = "block";
  } else {
    alert("wrong password");
  }
}

var audio = document.getElementById("audio");
var playBtn = document.querySelector(".play-btn");
var progressFilled = document.getElementById("progressFilled");

function togglePlay() {
  if (audio.paused) {
    audio.play();
    playBtn.textContent = "PAUSE";
  } else {
    audio.pause();
    playBtn.textContent = "PLAY";
  }
}

audio.addEventListener("timeupdate", function() {
  if (audio.duration) {
    var percent = (audio.currentTime / audio.duration) * 100;
    progressFilled.style.width = percent + "%";
  }
});

function seek(e) {
  var width = e.currentTarget.clientWidth;
  var clickX = e.offsetX;
  var duration = audio.duration;
  audio.currentTime = (clickX / width) * duration;
}
</script>

</body>
</html>
