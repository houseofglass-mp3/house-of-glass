<!DOCTYPE html>
<html>
<head>
  <title>house of glass</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: 'Press Start 2P', monospace;
      background: white;
      color: black;
      overflow: hidden;
      text-align: center;
    }

    /* Landing page video + overlay */
    #landing {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    #landing video {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    #landingText {
      font-size: 40px;
      color: black;
      margin-bottom: 30px;
      text-shadow: 2px 2px white; /* optional retro style */
    }

    #enterBtn {
      font-size: 20px;
      padding: 20px 50px;
      cursor: pointer;
      border: 3px solid black;
      background: white;
      color: black;
    }

    #enterBtn:hover {
      background: black;
      color: white;
    }

    /* Password container (appears after clicking ENTER) */
    #passwordContainer {
      display: none;
      background: white;
      border: 3px solid black;
      padding: 20px;
      margin-top: 20px;
    }

    #passwordInput {
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      padding: 10px;
      width: 200px;
      border: 2px solid black;
      background: white;
      color: black;
    }

    #submitBtn {
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      padding: 10px 20px;
      margin-top: 10px;
      border: 2px solid black;
      background: white;
      cursor: pointer;
    }

    #submitBtn:hover {
      background: black;
      color: white;
    }

    /* Main content */
    #mainContent {
      display: none;
      padding-top: 50px;
    }

    audio {
      margin-top: 40px;
      width: 80%;
      max-width: 500px;
    }
  </style>
</head>
<body>

<!-- Landing page -->
<div id="landing">
  <video autoplay loop muted>
    <source src="landing.mp4" type="video/mp4">
  </video>
  <div id="landingText">house of glass</div>
  <button id="enterBtn">ENTER NOW</button>

  <!-- Password form -->
  <div id="passwordContainer">
    <p>enter password</p>
    <input type="password" id="passwordInput" placeholder="password">
    <br>
    <button id="submitBtn">submit</button>
  </div>
</div>

<!-- Main content after correct password -->
<div id="mainContent">
  <h1>good luck madeleine</h1>
  <audio controls>
    <source src="https://drive.google.com/uc?export=download&id=1jUqO9_arO8nOiIeVMFgnMnFGqHwnDR7O" type="audio/mpeg">
  </audio>
</div>

<script>
  const enterBtn = document.getElementById('enterBtn');
  const passwordContainer = document.getElementById('passwordContainer');
  const submitBtn = document.getElementById('submitBtn');
  const passwordInput = document.getElementById('passwordInput');

  // Show password input after clicking ENTER NOW
  enterBtn.addEventListener('click', () => {
    passwordContainer.style.display = 'block';
    enterBtn.style.display = 'none';
  });

  // Check password
  submitBtn.addEventListener('click', () => {
    const pwd = passwordInput.value.trim().toLowerCase();
    if(pwd === 'madeleine') {
      document.getElementById('landing').style.display = 'none';
      document.getElementById('mainContent').style.display = 'block';
    } else {
      alert('access denied');
      passwordInput.value = '';
    }
  });

  // Optional: Enter key submits
  passwordInput.addEventListener('keypress', (e) => {
    if(e.key === 'Enter') submitBtn.click();
  });
</script>

</body>
</html>
