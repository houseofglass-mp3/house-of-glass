<!DOCTYPE html>
<html>
<head>
  <title>house of glass</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: 'Press Start 2P', monospace;
      background: white;
      color: black;
      overflow: hidden;
      text-align: center;
    }

    /* Landing page */
    #landing {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    #landing video {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    #landingText {
      font-size: 40px;
      color: black;
      margin-bottom: 20px;
      text-shadow: 2px 2px white;
    }

    #enterBtn {
      font-size: 16px;
      padding: 12px 30px;
      cursor: pointer;
      border: 2px solid black;
      background: white;
      color: black;
      transition: all 0.2s ease;
    }

    #enterBtn:hover {
      background: black;
      color: white;
    }

    /* Password container */
    #passwordContainer {
      display: none;
      background: white;
      border: 2px solid black;
      padding: 15px;
      margin-top: 15px;
    }

    #passwordInput {
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      padding: 8px;
      width: 180px;
      border: 2px solid black;
      background: white;
      color: black;
    }

    #submitBtn {
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      padding: 8px 16px;
      margin-top: 8px;
      border: 2px solid black;
      background: white;
      cursor: pointer;
    }

    #submitBtn:hover {
      background: black;
      color: white;
    }

    /* Main content */
    #mainContent {
      display: none;
      padding-top: 50px;
    }

    #trackTitle {
      font-size: 12px;
      margin-bottom: 10px;
      text-transform: lowercase;
    }

    iframe {
      width: 80%;
      max-width: 500px;
      height: 80px; /* compact player */
      border: none;
    }

  </style>
</head>
<body>

<!-- Landing page -->
<div id="landing">
  <video autoplay loop muted>
    <source src="landing.mp4" type="video/mp4">
  </video>
  <div id="landingText">house of glass</div>
  <button id="enterBtn">ENTER NOW</button>

  <!-- Password form -->
  <div id="passwordContainer">
    <p>enter password</p>
    <input type="password" id="passwordInput" placeholder="password">
    <br>
    <button id="submitBtn">submit</button>
  </div>
</div>

<!-- Main content -->
<div id="mainContent">
  <div id="trackTitle">good luck madeleine</div>
  <iframe src="https://drive.google.com/file/d/1jUqO9_arO8nOiIeVMFgnMnFGqHwnDR7O/preview"></iframe>
</div>

<script>
  const enterBtn = document.getElementById('enterBtn');
  const passwordContainer = document.getElementById('passwordContainer');
  const submitBtn = document.getElementById('submitBtn');
  const passwordInput = document.getElementById('passwordInput');

  // Show password input after clicking ENTER NOW
  enterBtn.addEventListener('click', () => {
    passwordContainer.style.display = 'block';
    enterBtn.style.display = 'none';
  });

  // Check password
  submitBtn.addEventListener('click', () => {
    const pwd = passwordInput.value.trim().toLowerCase();
    if(pwd === 'madeleine') {
      document.getElementById('landing').style.display = 'none';
      document.getElementById('mainContent').style.display = 'block';
    } else {
      alert('access denied');
      passwordInput.value = '';
    }
  });

  // Submit with Enter key
  passwordInput.addEventListener('keypress', (e) => {
    if(e.key === 'Enter') submitBtn.click();
  });
</script>

</body>
</html>
