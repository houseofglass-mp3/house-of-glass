<!DOCTYPE html>
<html>
<head>
  <title>PRIVATE DEMOS_2003.EXE</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: black;
      color: #00ff99;
      font-family: 'Press Start 2P', cursive;
      text-align: center;
      text-shadow: 0 0 5px #00ff99;
    }

    @keyframes blink { 50% { opacity: 0.4; } }

    h1 {
      font-size: 18px;
      animation: blink 1s infinite;
      margin-top: 60px;
    }

    /* Loading screen */
    #loading-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: black;
      color: #00ff99;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 12px;
      z-index: 9999;
      text-shadow: 0 0 5px #00ff99;
    }

    #loading-screen p {
      margin: 5px 0;
      animation: blink 1s infinite;
    }

    /* Password box */
    .box {
      border: 3px solid #00ff99;
      padding: 30px;
      margin: 40px auto;
      display: inline-block;
      width: 80%;
      max-width: 600px;
    }

    input {
      background: black;
      border: 2px solid #00ff99;
      color: #00ff99;
      padding: 10px;
      font-family: 'Press Start 2P', cursive;
      margin-top: 20px;
    }

    button {
      background: #00ff99;
      border: none;
      padding: 10px 20px;
      font-family: 'Press Start 2P', cursive;
      cursor: pointer;
      margin-left: 10px;
    }

    button:hover {
      background: #ff00cc;
      color: black;
    }

    #content {
      display: none;
      margin-top: 30px;
    }

    audio {
      margin-top: 15px;
      width: 100%;
    }

    .footer {
      margin-top: 50px;
      font-size: 10px;
      opacity: 0.6;
    }
  </style>
</head>

<body>

  <!-- Loading screen -->
  <div id="loading-screen">
    <p>> CONNECTING TO PRIVATE SERVER...</p>
    <p>> INITIALIZING AUDIO STREAM...</p>
    <p>> AUTHENTICATING...</p>
    <p>> LOADING TRACK LIST...</p>
  </div>

  <h1>> ENTER ACCESS CODE</h1>

  <div class="box">
    <p>AUTHORIZED USERS ONLY</p>

    <input type="password" id="password" placeholder="PASSWORD">
    <button onclick="checkPassword()">ENTER</button>

    <div id="content">
      <h2>> UNRELEASED_DEMOS</h2>

      <p>Good_Luck_Madeleine.MP3</p>
      <audio controls>
        <source src="Good_Luck_Madeleine.MP3" type="audio/mpeg">
      </audio>

      <p>Restart.MP3</p>
      <audio controls>
        <source src="Restart.MP3" type="audio/mpeg">
      </audio>

      <p style="margin-top:30px;">>> DO NOT DISTRIBUTE</p>
    </div>
  </div>

  <div class="footer">
    © 2003 // PRIVATE SERVER NODE
  </div>

  <script>
    // Hide loading screen after 3 seconds
    window.addEventListener("load", function() {
      setTimeout(function() {
        document.getElementById("loading-screen").style.display = "none";
      }, 3000);
    });

    // Password protection
    function checkPassword() {
      var password = document.getElementById("password").value;
      if (password === "madeleine") {   // <-- PASSWORD SET HERE
        document.getElementById("content").style.display = "block";
      } else {
        alert("ACCESS DENIED");
      }
    }
  </script>

</body>
</html>
